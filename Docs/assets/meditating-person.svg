<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="500" height="300" fill="#0d1117"/>

  <!-- Soft glow behind figure -->
  <circle cx="250" cy="160" r="110" fill="#58a6ff" opacity="0.06"/>
  <circle cx="250" cy="160" r="75" fill="#58a6ff" opacity="0.08"/>

  <!-- Concentric calm rings -->
  <g stroke="#30363d" stroke-width="1" fill="none">
    <circle cx="250" cy="160" r="95"/>
    <circle cx="250" cy="160" r="115"/>
  </g>

  <!-- Cushion -->
  <ellipse cx="250" cy="228" rx="70" ry="14" fill="#30363d"/>

  <!-- Person meditating, cross-legged, lotus hands -->
  <g stroke="#e6edf3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- crossed legs -->
    <path d="M 195 215 Q 250 235 305 215" />
    <path d="M 205 218 Q 250 200 295 218" />

    <!-- torso -->
    <line x1="250" y1="200" x2="250" y2="140"/>

    <!-- shoulders / arms resting on knees -->
    <path d="M 250 150 Q 215 155 205 210"/>
    <path d="M 250 150 Q 285 155 295 210"/>

    <!-- hands resting -->
    <circle cx="205" cy="211" r="4" fill="#e6edf3" stroke="none"/>
    <circle cx="295" cy="211" r="4" fill="#e6edf3" stroke="none"/>

    <!-- head -->
    <circle cx="250" cy="122" r="20" fill="none"/>

    <!-- closed eyes, serene -->
    <line x1="242" y1="122" x2="247" y2="122" stroke-width="2"/>
    <line x1="253" y1="122" x2="258" y2="122" stroke-width="2"/>

    <!-- small smile -->
    <path d="M 244 130 Q 250 133 256 130" stroke-width="2"/>
  </g>

  <!-- Gentle energy/breath lines rising above the head -->
  <g stroke="#58a6ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M 235 90 Q 232 75 238 60"/>
    <path d="M 250 85 Q 247 68 253 52"/>
    <path d="M 265 90 Q 268 75 262 60"/>
  </g>
</svg>
